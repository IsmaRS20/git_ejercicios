<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - Ismael Rodríguez</title>
    <style>
        :root {
            --link-color: rgb(255,255,255);
            --button-color: rgb(0, 92, 179);
            --button-color-hov: rgb(33, 148, 255);
            --button-border: rgb(0, 43, 124);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        a {
            text-align: center;
            display: block;
            text-decoration: none;
            font-size: 1.5rem;
            padding: 1rem;
            width: 600px;
            box-sizing: border-box;
            border-radius: 10px;
            color: var(--link-color);
            background-color: var(--button-color);
            border: 5px solid var(--button-border);
            box-shadow: 0 10px 0 var(--button-border);
            transition: all .25s ease;
            margin-bottom: 1rem;
        }

        a:hover {
            background-color: var(--button-color-hov);
        }

        a:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 var(--button-border);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <ul>
            <li><a href="http://cursoweb.tech/ismael2/tienda">Tienda</a></li>
            <li><a href="http://cursoweb.tech/ismael2/calendario">Calendario 2026</a></li>
        </ul>
    </div>
</body>
</html>
